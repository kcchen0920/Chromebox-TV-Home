<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE3D1" />
      <stop offset="100%" stop-color="#FCD0B1" />
    </radialGradient>
    <radialGradient id="capGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .waving-hand {
      transform-origin: 90px 75px;
      animation: waveHand 1.6s ease-in-out infinite;
    }
    .blink {
      transform-origin: center;
      animation: blinkEyes 3.5s infinite;
    }
  </style>

  <g filter="url(#softGlow)">
    <!-- 圓圓小耳朵 -->
    <circle cx="28" cy="62" r="10" fill="#FCD0B1" />
    <circle cx="28" cy="62" r="5" fill="#F8B48B" />
    <circle cx="92" cy="62" r="10" fill="#FCD0B1" />
    <circle cx="92" cy="62" r="5" fill="#F8B48B" />

    <!-- 臉蛋主體 -->
    <circle cx="60" cy="65" r="34" fill="url(#faceGrad)" stroke="#F8B48B" stroke-width="1.5" />

    <!-- 可愛鴨舌帽 / 棒球帽 -->
    <path d="M 28 54 Q 60 26 92 54 Z" fill="url(#capGrad)" />
    <!-- 帽沿 -->
    <path d="M 36 54 Q 70 48 102 52 Q 70 59 36 54 Z" fill="#0369A1" />
    <circle cx="60" cy="38" r="4" fill="#FACC15" />

    <!-- 頭髮瀏海 -->
    <path d="M 40 50 Q 48 57 52 50 Q 58 58 64 50 Q 72 58 80 50" fill="none" stroke="#6D4C41" stroke-width="3" stroke-linecap="round" />

    <!-- 眼睛 (會定期眨眼) -->
    <g class="blink">
      <!-- 左眼 -->
      <ellipse cx="48" cy="65" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="49.5" cy="63.5" r="1.5" fill="#FFFFFF" />
      <!-- 右眼 -->
      <ellipse cx="72" cy="65" rx="4" ry="5.5" fill="#1E293B" />
      <circle cx="73.5" cy="63.5" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 腮紅 -->
    <ellipse cx="40" cy="73" rx="5" ry="3" fill="#FB7185" opacity="0.6" />
    <ellipse cx="80" cy="73" rx="5" ry="3" fill="#FB7185" opacity="0.6" />

    <!-- 開心笑臉嘴巴 -->
    <path d="M 54 75 Q 60 82 66 75" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" />

    <!-- 揮揮小手 (動態揮手打招呼) -->
    <g class="waving-hand">
      <circle cx="98" cy="72" r="8" fill="#FCD0B1" stroke="#F8B48B" stroke-width="1" />
      <path d="M 94 71 Q 98 67 101 70" fill="none" stroke="#F8B48B" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
